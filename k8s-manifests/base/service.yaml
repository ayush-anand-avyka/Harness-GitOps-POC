apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: demo
  labels:
    app: demo-app
    managed-by: harness-gitops
spec:
  # Access the app with:  kubectl port-forward svc/demo-app 8080:80 -n demo
  type: ClusterIP
  selector:
    app: demo-app
  ports:
    - port: 80
      targetPort: 8080
